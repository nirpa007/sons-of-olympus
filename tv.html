<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sons of Olympus - TV check</title>
<style>body{margin:0;background:#0a1030;color:#fff;font:28px Georgia,serif;text-align:center;padding:30px}h1{color:#ffd24a;font-size:46px;margin:10px}.row{margin:18px auto;max-width:1100px;background:rgba(255,255,255,.06);border:3px solid rgba(255,210,74,.5);border-radius:18px;padding:18px}.ok{color:#7fffb0}.bad{color:#ff9a7a}b{color:#ffd24a}#pads div{margin:8px}a{display:inline-block;margin-top:20px;font-size:34px;color:#000;background:#ffd24a;padding:18px 40px;border-radius:16px;text-decoration:none;font-weight:bold}</style></head><body>
<h1>SONS OF OLYMPUS - TV CHECK</h1>
<div class="row">1. 3D graphics: <span id="gl">checking...</span></div>
<div class="row">2. Controllers: <span id="pc">press any button on each controller...</span><div id="pads"></div></div>
<a id="go" href="index.html?tv=1">▶ START THE GAME (TV MODE)</a>
<script>
const $=id=>document.getElementById(id);
let gl=null;try{const c=document.createElement('canvas');gl=c.getContext('webgl2')||c.getContext('webgl')}catch(e){}
$('gl').innerHTML=gl?'<span class="ok">✓ works</span>':'<span class="bad">✗ not supported - the game can not run in this browser</span>';
function loop(t){
 let pads=[];try{pads=[...(navigator.getGamepads?navigator.getGamepads():[])].filter(Boolean)}catch(e){}
 if(!navigator.getGamepads)$('pc').innerHTML='<span class="bad">✗ this browser does not support controllers</span>';
 else if(pads.length){$('pc').innerHTML='<span class="ok">✓ '+pads.length+' controller'+(pads.length>1?'s':'')+' seen</span>';$('pads').innerHTML=pads.map((p,i)=>'<div>Controller '+(i+1)+': '+p.id.slice(0,40)+' - pressed: <b>'+(p.buttons.map((b,k)=>b.pressed?k:null).filter(x=>x!==null).join(', ')||'-')+'</b> - stick: '+(p.axes[0]||0).toFixed(1)+', '+(p.axes[1]||0).toFixed(1)+'</div>').join('')}
 requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
